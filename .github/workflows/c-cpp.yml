name: Build Xdelta3 on Windows

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install MSYS2
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          git
          make
          automake
          autoconf
          gcc
          mingw-w64-x86_64-toolchain

    - name: Build with MSYS2
      shell: msys2 {0}
      run: |
        ./configure
        make

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: xdelta3-windows
        path: ./xdelta3/xdelta3.exe
