name: Build xdelta for Windows (via MSYS2)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          base-devel
          mingw-w64-x86_64-gcc
          make

    - name: Clone xdelta
      run: git clone https://github.com/jmacd/xdelta.git

    - name: Build with make
      shell: msys2 {0}
      run: |
        cd xdelta
        ./autogen.sh
        ./configure --host=x86_64-w64-mingw32
        make

    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: xdelta3-exe
        path: xdelta/xdelta3.exe
