name: Windows Build (xdelta via MinGW)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install MinGW and CMake
      run: |
        sudo apt update
        sudo apt install -y mingw-w64 cmake ninja-build

    - name: Create build directory
      run: mkdir -p build

    - name: Configure with CMake (MinGW)
      working-directory: ./build
      run: |
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=../cmake/mingw-w64-x86_64.cmake \
          -DCMAKE_BUILD_TYPE=Release \
          -G Ninja

    - name: Build
      working-directory: ./build
      run: ninja

    - name: Upload built .exe artifacts
      uses: actions/upload-artifact@v4
      with:
        name: xdelta-windows-exe
        path: |
          build/xdelta3.exe
